<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>99 Names of Allah - A-Imaan Islamic</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="navbar-container"></div>
    
    <div class="toolbar">
        <div class="search-wrapper" style="width: 100%; max-width: 500px; margin: 0 auto;">
            <svg viewBox="0 0 24 24"><path d="M9.5 3A6.5 6.5 0 0 1 16 9.5C16 11.11 15.41 12.59 14.44 13.73L14.71 14H15.5L20.5 19L19 20.5L14 15.5V14.71L13.73 14.44C12.59 15.41 11.11 16 9.5 16A6.5 6.5 0 0 1 3 9.5A6.5 6.5 0 0 1 9.5 3M9.5 5C7 5 5 7 5 9.5A4.5 4.5 0 0 0 9.5 14A4.5 4.5 0 0 0 14 9.5A4.5 4.5 0 0 0 9.5 5Z"/></svg>
            <input type="text" id="namesSearchInput" placeholder="Search names by transliteration, meaning, or Urdu..." oninput="searchNames()">
        </div>
    </div>

    <div class="names-viewer">
        <div class="names-grid" id="namesGrid">
            <div class="loading-state">Loading 99 Names...</div>
        </div>
    </div>
    
    <script>
        const NAMES_JSON = "assets/json/99-names.json";
        let namesData = [], filteredNames = [];
        const namesGrid = document.getElementById('namesGrid');

        async function loadNamesData() {
            try {
                const response = await fetch(NAMES_JSON);
                if (!response.ok) throw new Error("JSON file not found");
                const data = await response.json();
                namesData = data.sections[0].points || [];
                filteredNames = [...namesData];
                renderNames(filteredNames);
            } catch (error) {
                namesGrid.innerHTML = `<div class="loading-state" style="color:red;">Error loading ${NAMES_JSON}.</div>`;
            }
        }

        function renderNames(data) {
            namesGrid.innerHTML = '';
            if (data.length === 0) { namesGrid.innerHTML = '<div class="loading-state">No names found.</div>'; return; }

            const fragment = document.createDocumentFragment();
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'name-card';
                card.innerHTML = `
                    <div class="name-arabic">${item.arabic_text}</div>
                    <div class="name-translit">${item.transliteration_english}</div>
                    <div class="name-meaning-eng">${item.meaning_english}</div>
                    <div class="name-meaning-urdu">${item.translation_urdu}</div>
                `;
                fragment.appendChild(card);
            });
            namesGrid.appendChild(fragment);
        }

        function searchNames() {
            const term = document.getElementById('namesSearchInput').value.toLowerCase();
            filteredNames = namesData.filter(n => 
                n.transliteration_english.toLowerCase().includes(term) ||
                n.meaning_english.toLowerCase().includes(term) ||
                n.translation_urdu.includes(term) ||
                n.arabic_text.includes(term)
            );
            renderNames(filteredNames);
        }

        loadNamesData();
    </script>
    <script src="load-navbar.js"></script>
</body>
</html>
