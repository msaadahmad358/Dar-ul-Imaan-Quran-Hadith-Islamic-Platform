<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listen Quran - A-Imaan Islamic</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="navbar-container"></div>
 
    <div class="app-body">
        <div id="sidebar">
            <div class="sidebar-header">
                <div class="search-wrapper">
                    <svg viewBox="0 0 24 24"><path d="M9.5 3A6.5 6.5 0 0 1 16 9.5C16 11.11 15.41 12.59 14.44 13.73L14.71 14H15.5L20.5 19L19 20.5L14 15.5V14.71L13.73 14.44C12.59 15.41 11.11 16 9.5 16A6.5 6.5 0 0 1 3 9.5A6.5 6.5 0 0 1 9.5 3M9.5 5C7 5 5 7 5 9.5A4.5 4.5 0 0 0 9.5 14A4.5 4.5 0 0 0 14 9.5A4.5 4.5 0 0 0 9.5 5Z"/></svg>
                    <input type="text" id="sidebarFilterInput" placeholder="Search Surah..." oninput="filterSidebar()">
                </div>
            </div>
            <ul id="sidebarList"></ul>
        </div>

        <div id="contentArea">
            <div class="toolbar">
                <div class="toolbar-group"><span style="font-family:var(--font-english); font-weight:bold;">Audio Player</span></div>
            </div>
            <div class="listen-container">
                <h2 class="listen-title" id="listenSurahTitle">Select a Surah</h2>
                <p class="listen-subtitle" id="listenSurahSubtitle">Choose from the index</p>
                <div class="audio-player-box">
                    <audio id="listenAudioPlayer" controls>Your browser does not support audio.</audio>
                    <select id="reciterSelect" class="reciter-select" onchange="changeReciter()">
                        <option value="yasser-al-dossari">Yasser Al-Dossari</option>
                        <option value="maher-al-muaiqly">Maher Al-Muaiqly</option>
                        <option value="abdurrahmaan-as-sudais">Abdurrahmaan As-Sudais</option>
                        <option value="abdul-baset">Abdul Baset</option>
                    </select>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE = "https://api.kalamalah.com/api";
        const surahData = [
            { id: 1, name: "Al-Fatihah" }, { id: 2, name: "Al-Baqarah" }, { id: 3, name: "Ali 'Imran" },
            { id: 4, name: "An-Nisa" }, { id: 5, name: "Al-Ma'idah" }, { id: 6, name: "Al-An'am" },
            { id: 7, name: "Al-A'raf" }, { id: 8, name: "Al-Anfal" }, { id: 9, name: "At-Tawbah" },
            { id: 10, name: "Yunus" }, { id: 11, name: "Hud" }, { id: 12, name: "Yusuf" },
            { id: 13, name: "Ar-Ra'd" }, { id: 14, name: "Ibrahim" }, { id: 15, name: "Al-Hijr" },
            { id: 16, name: "An-Nahl" }, { id: 17, name: "Al-Isra" }, { id: 18, name: "Al-Kahf" },
            { id: 19, name: "Maryam" }, { id: 20, name: "Taha" }, { id: 21, name: "Al-Anbya" },
            { id: 22, name: "Al-Hajj" }, { id: 23, name: "Al-Mu'minun" }, { id: 24, name: "An-Nur" },
            { id: 25, name: "Al-Furqan" }, { id: 26, name: "Ash-Shu'ara" }, { id: 27, name: "An-Naml" },
            { id: 28, name: "Al-Qasas" }, { id: 29, name: "Al-'Ankabut" }, { id: 30, name: "Ar-Rum" },
            { id: 31, name: "Luqman" }, { id: 32, name: "As-Sajdah" }, { id: 33, name: "Al-Ahzab" },
            { id: 34, name: "Saba" }, { id: 35, name: "Fatir" }, { id: 36, name: "Ya-Sin" },
            { id: 37, name: "As-Saffat" }, { id: 38, name: "Sad" }, { id: 39, name: "Az-Zumar" },
            { id: 40, name: "Ghafir" }, { id: 41, name: "Fussilat" }, { id: 42, name: "Ash-Shuraa" },
            { id: 43, name: "Az-Zukhruf" }, { id: 44, name: "Ad-Dukhan" }, { id: 45, name: "Al-Jathiyah" },
            { id: 46, name: "Al-Ahqaf" }, { id: 47, name: "Muhammad" }, { id: 48, name: "Al-Fath" },
            { id: 49, name: "Al-Hujurat" }, { id: 50, name: "Qaf" }, { id: 51, name: "Adh-Dhariyat" },
            { id: 52, name: "At-Tur" }, { id: 53, name: "An-Najm" }, { id: 54, name: "Al-Qamar" },
            { id: 55, name: "Ar-Rahman" }, { id: 56, name: "Al-Waqi'ah" }, { id: 57, name: "Al-Hadid" },
            { id: 58, name: "Al-Mujadila" }, { id: 59, name: "Al-Hashr" }, { id: 60, name: "Al-Mumtahanah" },
            { id: 61, name: "As-Saf" }, { id: 62, name: "Al-Jumu'ah" }, { id: 63, name: "Al-Munafiqun" },
            { id: 64, name: "At-Taghabun" }, { id: 65, name: "At-Talaq" }, { id: 66, name: "At-Tahrim" },
            { id: 67, name: "Al-Mulk" }, { id: 68, name: "Al-Qalam" }, { id: 69, name: "Al-Haqqah" },
            { id: 70, name: "Al-Ma'arij" }, { id: 71, name: "Nuh" }, { id: 72, name: "Al-Jinn" },
            { id: 73, name: "Al-Muzzammil" }, { id: 74, name: "Al-Muddaththir" }, { id: 75, name: "Al-Qiyamah" },
            { id: 76, name: "Al-Insan" }, { id: 77, name: "Al-Mursalat" }, { id: 78, name: "An-Naba" },
            { id: 79, name: "An-Nazi'at" }, { id: 80, name: "Abasa" }, { id: 81, name: "At-Takwir" },
            { id: 82, name: "Al-Infitar" }, { id: 83, name: "Al-Mutaffifin" }, { id: 84, name: "Al-Inshiqaq" },
            { id: 85, name: "Al-Buruj" }, { id: 86, name: "At-Tariq" }, { id: 87, name: "Al-A'la" },
            { id: 88, name: "Al-Ghashiyah" }, { id: 89, name: "Al-Fajr" }, { id: 90, name: "Al-Balad" },
            { id: 91, name: "Ash-Shams" }, { id: 92, name: "Al-Layl" }, { id: 93, name: "Ad-Duhaa" },
            { id: 94, name: "Ash-Sharh" }, { id: 95, name: "At-Tin" }, { id: 96, name: "Al-'Alaq" },
            { id: 97, name: "Al-Qadr" }, { id: 98, name: "Al-Bayyinah" }, { id: 99, name: "Az-Zalzalah" },
            { id: 100, name: "Al-'Adiyat" }, { id: 101, name: "Al-Qari'ah" }, { id: 102, name: "At-Takathur" },
            { id: 103, name: "Al-'Asr" }, { id: 104, name: "Al-Humazah" }, { id: 105, name: "Al-Fil" },
            { id: 106, name: "Quraysh" }, { id: 107, name: "Al-Ma'un" }, { id: 108, name: "Al-Kawthar" },
            { id: 109, name: "Al-Kafirun" }, { id: 110, name: "An-Nasr" }, { id: 111, name: "Al-Masad" },
            { id: 112, name: "Al-Ikhlas" }, { id: 113, name: "Al-Falaq" }, { id: 114, name: "An-Nas" }
        ];

        let currentSurahId = 1;
        let currentReciter = "yasser-al-dossari";
        const sidebarListEl = document.getElementById('sidebarList');
        const player = document.getElementById('listenAudioPlayer');
        const titleEl = document.getElementById('listenSurahTitle');
        const subtitleEl = document.getElementById('listenSurahSubtitle');

        function init() {
            renderSidebar();
            loadSurah(1, "Al-Fatihah");
        }

        function renderSidebar(data = surahData) {
            sidebarListEl.innerHTML = '';
            data.forEach(surah => {
                const li = document.createElement('li');
                if (surah.id === currentSurahId) li.classList.add('active');
                li.innerHTML = `<span>${surah.id}. ${surah.name}</span>`;
                li.onclick = () => loadSurah(surah.id, surah.name);
                sidebarListEl.appendChild(li);
            });
        }

        function loadSurah(id, name) {
            currentSurahId = id;
            titleEl.textContent = `Surah ${name}`;
            subtitleEl.textContent = `Surah Number: ${id}`;
            renderSidebar();
            
            const audioUrl = `${API_BASE}/${currentReciter}/murattal/${id.toString().padStart(3, '0')}`;
            player.src = audioUrl;
            player.onerror = () => alert(`Audio not available for ${name} with this reciter.`);
        }

        function changeReciter() {
            currentReciter = document.getElementById('reciterSelect').value;
            const surah = surahData.find(s => s.id === currentSurahId);
            if (surah) loadSurah(surah.id, surah.name);
        }

        function filterSidebar() {
            const term = document.getElementById('sidebarFilterInput').value.toLowerCase();
            const filtered = surahData.filter(s => s.name.toLowerCase().includes(term) || s.id.toString().includes(term));
            renderSidebar(filtered);
        }

        init();
    </script>
    <script src="load-navbar.js"></script>
</body>
</html>
